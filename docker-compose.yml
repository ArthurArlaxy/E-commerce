services:
  postgres:
    image: postgres:18.6
    container_name: postgres_ecommerce
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.10.2-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    container_name: redis_ecommerce
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-ecommerce
    env_file:
      - ./backend/.env
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/api
      - /api/node_modules
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worker-ecommerce
    command: npm run worker
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/api
      - /api/node_modules
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-ecommerce
    env_file:
      - ./frontend/.env
    environment:
      - WATCHPACK_POLLING=true 
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
volumes:
  pg-data:
  redis-data:
  pgadmin-data:
